questions:
  # ── Container image ──────────────────────────────────────────────────────────
  - variable: image.repository
    label: Image Repository
    description: "Container image repository for the UI."
    type: string
    default: "ghcr.io/doccaz/vm-import-ui"
    group: "Container Image"
  - variable: image.tag
    label: Image Tag
    description: "Image tag to deploy. Leave blank to use the chart's appVersion; use 'latest' for the newest build."
    type: string
    default: ""
    group: "Container Image"

  # ── Networking ───────────────────────────────────────────────────────────────
  - variable: service.type
    label: Service Type
    description: "How the UI is exposed."
    type: enum
    options:
      - "NodePort"
      - "ClusterIP"
      - "LoadBalancer"
    default: "NodePort"
    group: "Networking"
  - variable: service.nodePort
    label: NodePort
    description: "Fixed NodePort (Kubernetes allows 30000-32767). Used when Service Type is NodePort."
    type: int
    default: 32000
    min: 30000
    max: 32767
    group: "Networking"
    show_if: "service.type=NodePort"

  # ── Application ──────────────────────────────────────────────────────────────
  - variable: env.logLevel
    label: Log Level
    description: "Backend log verbosity."
    type: enum
    options:
      - "debug"
      - "info"
      - "warn"
      - "error"
    default: "info"
    group: "Application"

  # ── Rancher integration ──────────────────────────────────────────────────────
  - variable: navLink.enabled
    label: Add Rancher Menu Link
    description: "Create a ui.cattle.io NavLink so the UI appears in the Rancher / Harvester menu."
    type: boolean
    default: true
    group: "Rancher Integration"
  - variable: navLink.group
    label: Menu Group
    description: "Menu section the link is filed under. Leave blank for a flat, top-level item."
    type: string
    default: "Utilities"
    group: "Rancher Integration"
    show_if: "navLink.enabled=true"
  - variable: navLink.url
    label: Menu Link URL (optional)
    description: "External URL for the menu link, e.g. http://NODE-IP:32000 or a Cloudflare tunnel hostname. Leave blank to link via the in-cluster Service proxy (note: a single-page app may render blank under the proxy sub-path)."
    type: string
    default: ""
    group: "Rancher Integration"
    show_if: "navLink.enabled=true"

  # ── RBAC ─────────────────────────────────────────────────────────────────────
  - variable: rbac.create
    label: Create RBAC
    description: "Create the ClusterRole + ClusterRoleBinding the app needs to read Harvester, KubeVirt, VM Import Controller, and Forklift resources."
    type: boolean
    default: true
    group: "RBAC"
  - variable: export.enabled
    label: "Enable VM Export (Harvester → OVA)"
    description: "Adds an Export VMs page. Exports run as Kubernetes Jobs and need a ReadWriteMany volume to write OVAs to."
    type: boolean
    default: false
    group: "VM Export"
  - variable: export.storage.existingClaim
    label: "Existing RWX claim"
    description: "Name of an existing ReadWriteMany PVC to store exported OVAs (e.g. NFS-backed). Takes precedence over creating one."
    type: string
    default: ""
    show_if: "export.enabled=true"
    group: "VM Export"
  - variable: export.storage.create
    label: "Create the export volume"
    description: "Let the chart create the ReadWriteMany PVC. Ignored if an existing claim is given."
    type: boolean
    default: false
    show_if: "export.enabled=true"
    group: "VM Export"
  - variable: export.storage.storageClass
    label: "Export volume storage class"
    description: "Storage class for the created PVC. Must support ReadWriteMany (e.g. harvester-longhorn)."
    type: storageclass
    default: ""
    show_if: "export.enabled=true&&export.storage.create=true"
    group: "VM Export"
  - variable: export.storage.size
    label: "Export volume size"
    description: "Must hold the converted disks plus the finished OVA — roughly twice the used size of the largest VM you export."
    type: string
    default: "200Gi"
    show_if: "export.enabled=true&&export.storage.create=true"
    group: "VM Export"
  - variable: export.defaultProfile
    label: "Default OVF profile"
    description: "vmware = vSphere/ESXi. portable = VirtualBox/Proxmox/oVirt. faithful = virtio preserved, KVM only."
    type: enum
    options:
      - "vmware"
      - "portable"
      - "faithful"
    default: "vmware"
    show_if: "export.enabled=true"
    group: "VM Export"
  - variable: export.maxConcurrent
    label: "Maximum concurrent exports"
    description: "Each export converts a whole disk; running many at once saturates storage."
    type: int
    default: 2
    show_if: "export.enabled=true"
    group: "VM Export"
