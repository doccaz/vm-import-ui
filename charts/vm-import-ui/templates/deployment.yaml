apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vm-import-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vm-import-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vm-import-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vm-import-ui.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vm-import-ui.serviceAccountName" . }}
      automountServiceAccountToken: true

      initContainers:
        - name: generate-kubeconfig
          image: registry.suse.com/bci/bci-base:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -e
              CA_DATA=$(base64 -w 0 /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)
              mkdir -p /var/kubeconfig
              cat > /var/kubeconfig/config << KUBEEOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority-data: ${CA_DATA}
                  server: https://kubernetes.default.svc
                name: in-cluster
              contexts:
              - context:
                  cluster: in-cluster
                  user: in-cluster
                name: in-cluster
              current-context: in-cluster
              users:
              - name: in-cluster
                user:
                  tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              KUBEEOF
              chmod 644 /var/kubeconfig/config
              echo "kubeconfig written:"
              cat /var/kubeconfig/config
          volumeMounts:
            - name: kubeconfig-dir
              mountPath: /var/kubeconfig

      containers:
        - name: vm-import-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            # Blank out the auto-injected service-discovery env vars so that
            # client-go's rest.InClusterConfig() returns ErrNotInCluster and
            # the app falls through to use KUBECONFIG instead.
            # User-defined env vars are placed before auto-injected ones in the
            # container env, so these empty values take precedence.
            - name: KUBERNETES_SERVICE_HOST
              value: ""
            - name: KUBERNETES_SERVICE_PORT
              value: ""
            # Our clean, init-container-generated kubeconfig with the CA cert
            # embedded and no insecure flag — the app reads this as its only
            # config source once in-cluster detection is disabled above.
            - name: KUBECONFIG
              value: /var/kubeconfig/config
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            {{- if .Values.export.enabled }}
            # VM export. EXPORT_ROOT is this pod's view of the shared volume
            # (used to read worker status files and serve downloads);
            # EXPORT_PVC and EXPORT_IMAGE are what the export Jobs are given.
            # A VM's export Job runs in the VM's own namespace (a PVC cannot be
            # mounted across namespaces), so for any VM outside this release's
            # namespace the app auto-creates an EXPORT_PVC-named claim there
            # using EXPORT_STORAGE_CLASS/EXPORT_STORAGE_SIZE. POD_NAMESPACE lets
            # it tell whether EXPORT_ROOT is that export's actual volume before
            # trusting it for progress/downloads.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: EXPORT_ROOT
              value: {{ .Values.export.storage.mountPath | quote }}
            - name: EXPORT_PVC
              value: {{ include "vm-import-ui.exportClaimName" . | quote }}
            - name: EXPORT_STORAGE_CLASS
              value: {{ .Values.export.storage.storageClass | quote }}
            - name: EXPORT_STORAGE_SIZE
              value: {{ .Values.export.storage.size | quote }}
            - name: EXPORT_IMAGE
              value: "{{ .Values.export.image.repository | default .Values.image.repository }}:{{ .Values.export.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
            - name: EXPORT_MAX_CONCURRENT
              value: {{ .Values.export.maxConcurrent | quote }}
            - name: EXPORT_TTL_SECONDS
              value: {{ .Values.export.ttlSecondsAfterFinished | quote }}
            - name: EXPORT_DOWNLOAD_MAX_BYTES
              # int64 forces integer rendering: YAML would otherwise turn a large
              # value into scientific notation ("2.147483648e+09"), which the
              # backend cannot parse and would silently ignore.
              value: {{ .Values.export.downloadMaxBytes | int64 | quote }}
            - name: EXPORT_RUN_AS_USER
              value: {{ .Values.export.securityContext.runAsUser | quote }}
            - name: EXPORT_FS_GROUP
              value: {{ .Values.export.securityContext.fsGroup | quote }}
            {{- end }}
            - name: UI_PATH
              value: {{ .Values.env.uiPath | quote }}
            - name: USE_MOCK_DATA
              value: {{ .Values.env.useMockData | quote }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: kubeconfig-dir
              mountPath: /var/kubeconfig
              readOnly: true
            {{- if .Values.export.enabled }}
            - name: export-storage
              mountPath: {{ .Values.export.storage.mountPath }}
            {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: kubeconfig-dir
          emptyDir: {}
        {{- if .Values.export.enabled }}
        - name: export-storage
          persistentVolumeClaim:
            claimName: {{ include "vm-import-ui.exportClaimName" . }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
