# Default values for vm-import-ui.

replicaCount: 1

image:
  repository: ghcr.io/doccaz/vm-import-ui
  pullPolicy: IfNotPresent
  # Overrides the appVersion from Chart.yaml when set
  tag: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Create a dedicated ServiceAccount for the pod
  create: true
  # Use a custom name; defaults to the chart fullname
  name: ""
  annotations: {}

rbac:
  # Create ClusterRole + ClusterRoleBinding granting the app access to
  # Harvester, KubeVirt, CDI, VM Import Controller, and Forklift resources
  create: true

service:
  type: NodePort
  port: 8080
  # Fixed NodePort. Kubernetes only allows 30000-32767 for NodePorts, so a host
  # firewall must permit that range regardless of the value chosen. 32000 sits high
  # in the range, away from the low/round ports (30000, 30080, 30443) that other
  # tools commonly grab, minimising collisions. Set to "" to let Kubernetes pick one.
  nodePort: 32000

env:
  # Log verbosity: debug | info | warn | error
  logLevel: info
  # Internal path to the React build — matches Dockerfile COPY destination
  uiPath: /ui
  # Set to "true" to run in dev/mock mode without a real cluster
  useMockData: "false"

# Rancher UI integration: create a ui.cattle.io NavLink so the app shows up in
# the Rancher / Harvester left-hand menu. The NavLink is only rendered when the
# ui.cattle.io/v1 CRD is present (Rancher-managed clusters such as Harvester),
# so leaving this enabled is safe on plain Kubernetes — it's simply skipped.
navLink:
  enabled: true
  label: "VM Import UI"
  # Menu group/section the link is filed under. Set to "" for a flat, top-level
  # item in the main menu (no group header).
  group: "Utilities"
  description: "Import VMs from VMware vCenter into Harvester"
  # External URL for the link, e.g. "http://<node-ip>:32000". Leave blank to link
  # through the in-cluster Service proxy (works without knowing a node IP, but the
  # UI must tolerate being served under a sub-path).
  url: ""
  # Icon shown beside the menu entry (data URI or URL). Defaults to the app icon.
  iconSrc: "data:image/svg+xml;base64,"

# Resource requests and limits (leave empty to use cluster defaults)
resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 500m
  #   memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

# ── VM Export (Harvester VM → OVA) ──────────────────────────────────────────
# Exports run as a Kubernetes Job in the source VM's namespace. The Job mounts
# the VM's PVCs read-only as block devices, converts them with qemu-img, and
# writes the finished .ova to a shared ReadWriteMany volume.
export:
  enabled: false

  storage:
    # Use an existing RWX claim (e.g. backed by NFS). Takes precedence.
    existingClaim: ""
    # Or let the chart create one in this release's own namespace.
    create: false
    # storageClass and size are also handed to the app (EXPORT_STORAGE_CLASS /
    # EXPORT_STORAGE_SIZE) and reused whenever it auto-creates a same-named
    # claim in a VM's namespace — a VM's export Job runs there, not here, since
    # a PVC cannot be mounted across namespaces. See "Cross-namespace export
    # storage" in docs/architecture-notes.md.
    storageClass: ""
    size: 200Gi
    accessMode: ReadWriteMany
    # Where the export volume is mounted, in both this pod and the export Jobs.
    mountPath: /export

  # Maximum simultaneous export Jobs. Exact at replicaCount 1; advisory above.
  maxConcurrent: 2
  # How long a finished export Job is kept before Kubernetes removes it.
  ttlSecondsAfterFinished: 3600
  # Hard cap on a single export.
  activeDeadlineSeconds: 21600
  # Server-side cap on browser downloads; larger OVAs must be fetched from the
  # share directly, because the UI materialises the response in memory.
  downloadMaxBytes: 2147483648
  defaultProfile: vmware

  # The export Job runs the same image as the API. Leave blank to reuse it.
  image:
    repository: ""
    tag: ""

  # Block-mode PVCs are exposed to the Job as device nodes owned by this group.
  # If exports fail with "permission denied" on /dev/vmdisk0, this is the knob.
  securityContext:
    runAsUser: 0
    fsGroup: 0

  jobResources: {}

