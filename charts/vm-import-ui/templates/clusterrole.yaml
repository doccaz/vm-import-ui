{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vm-import-ui.fullname" . }}
  labels:
    {{- include "vm-import-ui.labels" . | nindent 4 }}
rules:
  # Derived from the API calls in pkg/*.go (see docs/rbac-audit.md).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  # Source/provider credentials. Only fetched by name: no list/watch.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list"]
  - apiGroups: ["harvesterhci.io"]
    resources: ["settings"]
    verbs: ["get"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["list"]

  # ── VM Import Controller ─────────────────────────────────────────────────────
  - apiGroups: ["migration.harvesterhci.io"]
    resources: ["vmwaresources", "ovasources", "virtualmachineimports"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["migration.harvesterhci.io"]
    resources: ["virtualmachineimports/status"]
    verbs: ["update"]

  # ── Forklift / Konveyor MTV ──────────────────────────────────────────────────
  - apiGroups: ["forklift.konveyor.io"]
    resources: ["providers", "plans", "networkmaps", "storagemaps", "migrations"]
    verbs: ["get", "list", "create", "update", "delete"]

  {{- if .Values.export.enabled }}
  # ── VM export: the Job is the export's state record; the claim is created in
  # the source VM's namespace when missing. Granted only when export is enabled.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create"]
  {{- end }}
{{- end }}
